services:
  normalizeusz:
    build: .
    container_name: normalizeusz
    image: normalizeusz:latest
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Warsaw
      - DEBOUNCE_SECONDS=5
      - INITIAL_SCAN=true
      - MAX_THREADS=MAX
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
    volumes:
      - /home/mateusz/media/music:/music:rw
